services:
  - type: web
    name: asterdeck-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_MODEL
        value: sarvam-105b
      - key: DEMO_ACCESS_CODE
        sync: false
